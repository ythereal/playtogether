<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess · PlayTogether</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <style>
    :root {
      --sq-light: #f2dfc2;
      --sq-dark: #b9875f;
      --piece-w: #fbf7ef;
      --piece-b: #1a1721;
      --hl-move: rgba(255, 210, 60, .45);
      --hl-sel: rgba(255, 180, 0, .75);
      --hl-check: rgba(232, 60, 40, .9);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --sq-light: #d8c3a2; --sq-dark: #8f6a4a; }
    }
    :root[data-theme="dark"] { --sq-light: #d8c3a2; --sq-dark: #8f6a4a; }

    .game-inner { gap: 12px; }
    .player {
      width: 100%; display: flex; align-items: center; gap: 10px;
      background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
      padding: 8px 12px; min-height: 48px;
    }
    .player .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); flex: none; }
    .player.active .dot { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); }
    .player .name { font-weight: 700; white-space: nowrap; }
    .player.host .name { color: var(--accent); }
    .player.guest .name { color: var(--accent-2); }
    .player .lost { flex: 1; font-size: 1.05rem; letter-spacing: -.1em; color: var(--muted); overflow: hidden; white-space: nowrap; }
    .player .adv { font-weight: 700; color: var(--muted); font-size: .9rem; }
    .player .wins { font-size: .85rem; color: var(--muted); font-weight: 600; }

    .board-wrap { position: relative; width: min(480px, 100%); }
    .board {
      display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); grid-template-rows: repeat(8, minmax(0, 1fr));
      width: 100%; aspect-ratio: 1; border-radius: 10px; overflow: hidden;
      box-shadow: 0 0 0 2px var(--line), var(--shadow);
    }
    .sq {
      appearance: none; border: 0; margin: 0; padding: 0; min-width: 0; min-height: 0;
      position: relative; cursor: default; touch-action: manipulation;
      display: grid; place-items: center;
      font-family: 'Segoe UI Symbol', 'Apple Symbols', 'DejaVu Sans', 'Noto Sans Symbols 2', system-ui, sans-serif;
      font-size: clamp(1.5rem, 8.5vw, 2.7rem); line-height: 1;
      background: var(--sq-light);
      -webkit-user-select: none; user-select: none;
    }
    .sq.dark { background: var(--sq-dark); }
    .sq.can { cursor: pointer; }
    .sq.w { color: var(--piece-w); text-shadow: 0 1px 2px rgba(0, 0, 0, .7), 0 0 1px rgba(0, 0, 0, .9); }
    .sq.b { color: var(--piece-b); text-shadow: 0 1px 1px rgba(255, 255, 255, .25); }
    .sq.last { background-image: linear-gradient(var(--hl-move), var(--hl-move)); }
    .sq.sel { background-image: linear-gradient(var(--hl-sel), var(--hl-sel)); }
    .sq.check { background-image: radial-gradient(circle, var(--hl-check) 0%, var(--hl-check) 35%, transparent 75%); }
    .sq.target::after {
      content: ''; position: absolute; left: 50%; top: 50%; translate: -50% -50%;
      width: 28%; height: 28%; border-radius: 50%; background: rgba(20, 15, 10, .3);
    }
    .sq.target.capture::after {
      width: 86%; height: 86%; background: transparent; border: 4px solid rgba(20, 15, 10, .3);
    }
    .sq .coord {
      position: absolute; font-family: var(--font); font-size: .6rem; font-weight: 700; line-height: 1; opacity: .7;
      pointer-events: none; text-shadow: none;
    }
    .sq .coord.file { right: 3px; bottom: 2px; }
    .sq .coord.rank { left: 3px; top: 2px; }
    .sq.dark .coord { color: var(--sq-light); }
    .sq:not(.dark) .coord { color: var(--sq-dark); }
    .sq:focus-visible { outline: 3px solid var(--accent-2); outline-offset: -3px; }

    .promo {
      position: absolute; inset: 0; display: grid; place-items: center;
      background: rgba(0, 0, 0, .35); backdrop-filter: blur(2px); border-radius: 10px;
    }
    .promo-card { background: var(--surface); border-radius: 16px; padding: 12px; box-shadow: var(--shadow); text-align: center; }
    .promo-card p { margin: 0 0 8px; font-weight: 600; }
    .promo-row { display: flex; gap: 6px; }
    .promo-row .sq { width: 56px; height: 56px; border-radius: 10px; cursor: pointer; font-size: 2.2rem; }

    .moves {
      width: 100%; max-height: 3.6em; overflow-y: auto; font-size: .9rem; line-height: 1.5;
      color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; padding: 0 4px;
      overscroll-behavior: contain;
    }
    .moves b { color: var(--ink); font-weight: 700; }
    .moves .num { margin-left: .5em; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .game-status.check { color: var(--accent); }
    .game-status.me { color: var(--good); }
  </style>
</head>
<body>
  <main class="game">
    <div class="game-inner">
      <div class="player" id="pTop"><span class="dot"></span><span class="name"></span><span class="lost"></span><span class="adv"></span><span class="wins"></span></div>
      <div class="board-wrap">
        <div class="board" id="board" role="grid" aria-label="Chess board"></div>
        <div class="promo" id="promo" hidden>
          <div class="promo-card">
            <p>Promote to</p>
            <div class="promo-row" id="promoRow"></div>
          </div>
        </div>
      </div>
      <div class="player" id="pBottom"><span class="dot"></span><span class="name"></span><span class="lost"></span><span class="adv"></span><span class="wins"></span></div>
      <div class="game-status" id="status">Waiting for a friend…</div>
      <div class="moves" id="moves"></div>
      <div class="actions">
        <button class="pt-btn pt-btn-ghost pt-btn-small" id="draw">Offer draw</button>
        <button class="pt-btn pt-btn-ghost pt-btn-small" id="resign">Resign</button>
        <button class="pt-btn" id="again" hidden>Play again</button>
      </div>
    </div>
  </main>

  <script src="rules.js"></script>
  <script src="../../shared/net.js"></script>
  <script>
  (async () => {
    const R = window.ChessRules;
    // Filled glyphs for both colours (coloured by CSS); U+FE0E keeps them text, not emoji.
    const GLYPH = { K: '♚︎', Q: '♛︎', R: '♜︎', B: '♝︎', N: '♞︎', P: '♟︎' };
    const NAMES = { K: 'king', Q: 'queen', R: 'rook', B: 'bishop', N: 'knight', P: 'pawn' };
    const REASON = {
      checkmate: 'by checkmate', stalemate: 'Stalemate', fifty: 'Draw by the fifty-move rule',
      repetition: 'Draw by repetition', material: 'Draw: not enough material', agreed: 'Draw agreed', resign: 'by resignation',
    };

    // ---- host-side rules wrappers (pure: return the next state or null) ----
    function tally(s) {
      const r = s.result;
      if (r.winner === 'd') s.score.draws++;
      else if (r.winner === s.hostColor) s.score.host++;
      else s.score.guest++;
      return s;
    }
    function doMove(s, color, m) {
      if (s.turn !== color) return null;
      const n = R.play(s, m);
      if (n && n.result) tally(n);
      return n;
    }
    function doResign(s, color) {
      if (s.result) return null;
      return tally(Object.assign({}, s, { result: { winner: R.opp(color), reason: 'resign' }, drawOffer: null }));
    }
    function doDraw(s, color) {
      if (s.result) return null;
      if (s.drawOffer === R.opp(color)) return tally(Object.assign({}, s, { result: { winner: 'd', reason: 'agreed' }, drawOffer: null }));
      if (s.drawOffer === color) return null;
      return Object.assign({}, s, { drawOffer: color });
    }

    // ---- network ----
    const room = await PT.room({ game: 'chess', title: 'Chess' });
    let state = room.role === 'host' ? (room.saved || R.newState()) : null;
    const myColor = () => (room.role === 'host' ? state.hostColor : R.opp(state.hostColor));

    function broadcast() { room.save(state); room.send({ type: 'state', state }); }
    function commit(n) { if (!n) return; state = n; sel = null; broadcast(); render(); }

    room.on('connected', () => { if (room.role === 'host') broadcast(); render(); });
    room.on('disconnected', render);
    room.on('message', msg => {
      if (room.role === 'host') {
        const guest = R.opp(state.hostColor);
        if (msg.type === 'move') commit(doMove(state, guest, { from: msg.from, to: msg.to, promo: msg.promo }));
        else if (msg.type === 'resign') commit(doResign(state, guest));
        else if (msg.type === 'draw') commit(doDraw(state, guest));
        else if (msg.type === 'rematch' && state.result) commit(R.newState(state));
      } else if (msg.type === 'state') {
        state = msg.state; sel = null; render();
      }
    });

    // Intents: the host applies them directly, the guest sends them.
    function intend(msg, hostFn) {
      if (!room.connected || !state) return;
      if (room.role === 'host') commit(hostFn(state, state.hostColor));
      else room.send(msg);
    }
    const sendMove = m => intend(Object.assign({ type: 'move' }, m), (s, c) => doMove(s, c, m));

    // ---- view ----
    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const movesEl = document.getElementById('moves');
    const promoEl = document.getElementById('promo');
    const promoRow = document.getElementById('promoRow');
    const drawBtn = document.getElementById('draw');
    const resignBtn = document.getElementById('resign');
    const againBtn = document.getElementById('again');
    const top = document.getElementById('pTop'), bottom = document.getElementById('pBottom');

    let sel = null;           // selected square
    let targets = [];         // legal moves from sel
    let pendingPromo = null;  // { from, to } waiting for a piece choice
    let resignArmed = 0;

    const flipped = () => myColor() === 'b';
    const sqOf = i => (flipped() ? (i >> 3) * 8 + (7 - (i & 7)) : (7 - (i >> 3)) * 8 + (i & 7));

    const cells = [...Array(64)].map((_, i) => {
      const b = document.createElement('button');
      b.className = 'sq';
      b.addEventListener('click', () => onSquare(i));
      boardEl.appendChild(b);
      return b;
    });

    function onSquare(i) {
      if (!state || !room.connected || state.result || pendingPromo) return;
      const me = myColor();
      if (state.turn !== me) return;
      const sq = sqOf(i);
      const hit = targets.find(m => m.to === sq);
      if (sel !== null && hit) {
        if (hit.promo) { pendingPromo = { from: sel, to: sq }; sel = null; targets = []; render(); return; }
        sendMove({ from: sel, to: sq }); sel = null; targets = []; render(); return;
      }
      const p = state.board[sq];
      if (p && p[0] === me && sq !== sel) { sel = sq; targets = R.legalMoves(state, sq); }
      else { sel = null; targets = []; }
      render();
    }

    'QRNB'.split('').forEach(t => {
      const b = document.createElement('button');
      b.className = 'sq'; b.dataset.t = t;
      b.addEventListener('click', () => {
        if (!pendingPromo) return;
        sendMove({ from: pendingPromo.from, to: pendingPromo.to, promo: t });
        pendingPromo = null; render();
      });
      promoRow.appendChild(b);
    });
    promoEl.addEventListener('click', e => { if (e.target === promoEl) { pendingPromo = null; render(); } });

    drawBtn.addEventListener('click', () => intend({ type: 'draw' }, doDraw));
    resignBtn.addEventListener('click', () => {
      if (Date.now() - resignArmed < 4000) { resignArmed = 0; intend({ type: 'resign' }, doResign); return; }
      resignArmed = Date.now(); render();
      setTimeout(render, 4100);
    });
    againBtn.addEventListener('click', () => intend({ type: 'rematch' }, s => (s.result ? R.newState(s) : null)));

    function fillPlayer(el, color, isMe, mat) {
      const role = (color === state.hostColor) ? 'host' : 'guest';
      el.className = 'player ' + role + (state.turn === color && !state.result ? ' active' : '');
      el.querySelector('.name').textContent = (isMe ? 'You' : 'Friend') + ' · ' + (color === 'w' ? 'White' : 'Black');
      // Pieces this player has captured = what the other side lost
      el.querySelector('.lost').textContent = mat.lost[R.opp(color)].split('').map(t => GLYPH[t]).join('');
      const adv = color === 'w' ? mat.diff : -mat.diff;
      el.querySelector('.adv').textContent = adv > 0 ? '+' + adv : '';
      const wins = state.score[role], draws = state.score.draws;
      el.querySelector('.wins').textContent = wins + (wins === 1 ? ' win' : ' wins') + (draws ? ' · ' + draws + (draws === 1 ? ' draw' : ' draws') : '');
    }

    function render() {
      if (!state) { statusEl.textContent = 'Connecting…'; return; }
      const me = myColor();
      const myTurn = room.connected && !state.result && state.turn === me;
      const check = R.inCheck(state);   // also true after checkmate, so the mated king stays highlighted
      const kingInCheck = check ? R.kingSq(state.board, state.turn) : -1;
      const targetBy = new Map(targets.map(m => [m.to, m]));
      const flip = flipped();

      cells.forEach((c, i) => {
        const sq = sqOf(i), p = state.board[sq];
        const f = sq & 7, r = sq >> 3;
        const t = targetBy.get(sq);
        c.className = 'sq' + (((f + r) & 1) ? '' : ' dark') + (p ? ' ' + p[0] : '') +
          (state.lastMove && (state.lastMove.from === sq || state.lastMove.to === sq) ? ' last' : '') +
          (sq === sel ? ' sel' : '') + (sq === kingInCheck ? ' check' : '') +
          (t ? ' target' + (state.board[sq] || t.ep ? ' capture' : '') : '') +
          (myTurn && (t || (p && p[0] === me)) ? ' can' : '');
        let html = p ? GLYPH[p[1]] : '';
        if (i >= 56) html += '<span class="coord file">' + 'abcdefgh'[f] + '</span>';
        if ((i & 7) === 0) html += '<span class="coord rank">' + (r + 1) + '</span>';
        c.innerHTML = html;
        c.setAttribute('aria-label', R.sqName(sq) + (p ? ', ' + (p[0] === 'w' ? 'white ' : 'black ') + NAMES[p[1]] : ''));
      });
      boardEl.dataset.flip = flip ? '1' : '0';

      const mat = R.material(state.board);
      fillPlayer(top, R.opp(me), false, mat);
      fillPlayer(bottom, me, true, mat);

      // promotion picker
      promoEl.hidden = !pendingPromo;
      if (pendingPromo) promoRow.querySelectorAll('.sq').forEach(b => { b.className = 'sq ' + me; b.textContent = GLYPH[b.dataset.t]; });

      // move list
      movesEl.innerHTML = state.moves.map((m, i) =>
        (i % 2 === 0 ? '<span class="num">' + (i / 2 + 1) + '.</span> ' : '') + (i === state.moves.length - 1 ? '<b>' + m + '</b>' : m)
      ).join(' ');
      movesEl.scrollTop = movesEl.scrollHeight;

      // status
      let text, cls = '';
      const r = state.result;
      if (!room.connected) text = 'Waiting for your friend…';
      else if (r) {
        if (r.winner === 'd') text = REASON[r.reason] + '.';
        else { text = (r.winner === me ? 'You win ' : 'Your friend wins ') + REASON[r.reason] + '.'; cls = r.winner === me ? 'me' : ''; }
        if (r.reason === 'checkmate') text = 'Checkmate! ' + text;
      }
      else if (state.drawOffer && state.drawOffer !== me) { text = 'Your friend offers a draw.'; }
      else if (state.drawOffer === me) { text = 'Draw offered. ' + (myTurn ? 'Your turn.' : "Friend's turn."); }
      else if (myTurn) { text = check ? 'Check! Your turn.' : 'Your turn'; cls = check ? 'check' : 'me'; }
      else { text = check ? "Check! Friend's turn." : "Friend's turn"; }
      statusEl.textContent = text;
      statusEl.className = 'game-status ' + cls;

      // buttons
      const live = room.connected && !r;
      drawBtn.hidden = !live; resignBtn.hidden = !live;
      drawBtn.disabled = state.drawOffer === me;
      drawBtn.textContent = state.drawOffer && state.drawOffer !== me ? 'Accept draw' : state.drawOffer === me ? 'Draw offered' : 'Offer draw';
      drawBtn.classList.toggle('pt-btn-ghost', !(state.drawOffer && state.drawOffer !== me));
      const armed = Date.now() - resignArmed < 4000;
      resignBtn.textContent = armed ? 'Really resign?' : 'Resign';
      resignBtn.classList.toggle('pt-btn-ghost', !armed);
      againBtn.hidden = !r || !room.connected;
    }
    render();
  })();
  </script>
</body>
</html>
