<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Disappearing Tic-Tac-Toe · PlayTogether</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <style>
    .board {
      display: grid; gap: 10px;
      /* minmax(0, 1fr) keeps the 3 rows equal; plain 1fr lets a mark stretch its row */
      grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr));
      width: min(360px, 88vw); aspect-ratio: 1;
    }
    .cell {
      appearance: none; border: 0; cursor: pointer; position: relative; min-height: 0; padding: 0; overflow: hidden;
      background: var(--surface); border-radius: 18px;
      box-shadow: inset 0 0 0 1.5px var(--line);
      font-size: clamp(2.6rem, 14vw, 4.2rem); font-weight: 800; line-height: 1;
      display: grid; place-items: center; color: var(--ink);
      transition: background .12s ease, transform .08s ease;
    }
    .cell:not(:disabled):hover { background: var(--surface-2); }
    .cell:not(:disabled):active { transform: scale(.96); }
    .cell:disabled { cursor: default; }
    .cell.x { color: var(--accent); }
    .cell.o { color: var(--accent-2); }
    .cell.win { background: color-mix(in srgb, currentColor 16%, var(--surface)); box-shadow: inset 0 0 0 2.5px currentColor; }
    /* Effects target the mark (.m), never the tile itself. */
    .m { display: block; }
    .cell.pop .m { animation: pop .18s ease-out; }
    @keyframes pop { from { transform: scale(.6); opacity: .3; } to { transform: scale(1); opacity: 1; } }

    /* the oldest mark of a player who already has 3 on the board */
    .cell.old .m { opacity: .4; }
    .cell.old.next .m { animation: flicker 1.1s ease-in-out infinite; }
    .cell.old::after {
      content: ''; position: absolute; inset: 10px; border-radius: 12px;
      border: 2px dashed currentColor; opacity: .45; pointer-events: none;
    }
    @keyframes flicker { 50% { opacity: .15; } }
    .cell.gone .m { animation: vanish .35s ease-in both; }
    @keyframes vanish { from { opacity: .45; transform: scale(1); } to { opacity: 0; transform: scale(.4) rotate(-12deg); } }

    .score { display: flex; gap: 10px; width: 100%; justify-content: center; }
    .score div {
      flex: 1; max-width: 160px; text-align: center; background: var(--surface);
      border: 1px solid var(--line); border-radius: 14px; padding: 8px 6px;
    }
    .score b { display: block; font-size: 1.6rem; }
    .score small { color: var(--muted); font-weight: 600; }
    .score .me { box-shadow: inset 0 0 0 2px var(--line); }
    .score .x b { color: var(--accent); }
    .score .o b { color: var(--accent-2); }
    .turn-x { color: var(--accent); }
    .turn-o { color: var(--accent-2); }
    .hint { color: var(--muted); font-size: .9rem; text-align: center; margin: 0; max-width: 34ch; }
  </style>
</head>
<body>
  <main class="game">
    <div class="game-inner">
      <div class="score">
        <div class="x" id="scoreX"><b>0</b><small>X</small></div>
        <div class="o" id="scoreO"><b>0</b><small>O</small></div>
      </div>
      <div class="game-status" id="status">Waiting for a friend…</div>
      <div class="board" id="board"></div>
      <p class="hint">Only 3 marks each. Placing a 4th makes your oldest one (dashed) disappear.</p>
      <button class="pt-btn" id="again" hidden>Play again</button>
    </div>
  </main>

  <script src="../../shared/net.js"></script>
  <script>
  (async () => {
    const MAX = 3;
    // ---- rules (pure functions, host runs them) ----
    const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    function newState(prev) {
      const starter = prev ? (prev.starter === 'X' ? 'O' : 'X') : 'X';
      return {
        board: Array(9).fill(null),
        marks: { X: [], O: [] },        // each player's cells, oldest first
        turn: starter, starter,
        winner: null, line: null, removed: -1, placed: -1,
        score: prev ? prev.score : { X: 0, O: 0 },
      };
    }
    function applyMove(s, mark, i) {
      if (s.winner || s.turn !== mark || !Number.isInteger(i) || i < 0 || i > 8 || s.board[i] !== null) return false;
      s.removed = -1;
      if (s.marks[mark].length >= MAX) {
        s.removed = s.marks[mark].shift();
        s.board[s.removed] = null;
      }
      s.board[i] = mark; s.marks[mark].push(i); s.placed = i;
      const line = LINES.find(([a,b,c]) => s.board[a] && s.board[a] === s.board[b] && s.board[a] === s.board[c]);
      if (line) { s.winner = mark; s.line = line; s.score[mark]++; }
      else s.turn = mark === 'X' ? 'O' : 'X';
      return true;
    }

    // ---- network ----
    const room = await PT.room({ game: 'vanish', title: 'Disappearing Tic-Tac-Toe' });
    const me = room.role === 'host' ? 'X' : 'O';
    let state = room.role === 'host' ? (room.saved || newState()) : null;
    let animate = false;

    function broadcast() { room.save(state); room.send({ type: 'state', state }); }

    room.on('connected', () => { if (room.role === 'host') broadcast(); render(); });
    room.on('disconnected', render);
    room.on('message', msg => {
      if (room.role === 'host') {
        if (msg.type === 'move' && applyMove(state, 'O', msg.i)) { animate = true; broadcast(); render(); }
        if (msg.type === 'rematch' && state.winner) { state = newState(state); broadcast(); render(); }
      } else if (msg.type === 'state') {
        const prev = state;
        state = msg.state;
        animate = !!prev && state.placed >= 0 && prev.board[state.placed] !== state.board[state.placed];
        render();
      }
    });

    function play(i) {
      if (!room.connected || !state) return;
      if (room.role === 'host') { if (applyMove(state, 'X', i)) { animate = true; broadcast(); render(); } }
      else if (state.turn === me && !state.winner && !state.board[i]) room.send({ type: 'move', i });
    }
    function rematch() {
      if (room.role === 'host') { state = newState(state); broadcast(); render(); }
      else room.send({ type: 'rematch' });
    }

    // ---- view ----
    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const againBtn = document.getElementById('again');
    const cells = [...Array(9)].map((_, i) => {
      const b = document.createElement('button');
      b.className = 'cell';
      b.setAttribute('aria-label', 'Square ' + (i + 1));
      b.addEventListener('click', () => play(i));
      boardEl.appendChild(b);
      return b;
    });
    againBtn.addEventListener('click', rematch);
    document.getElementById(me === 'X' ? 'scoreX' : 'scoreO').classList.add('me');
    document.querySelector('#scoreX small').textContent = me === 'X' ? 'You (X)' : 'Friend (X)';
    document.querySelector('#scoreO small').textContent = me === 'O' ? 'You (O)' : 'Friend (O)';
    const glyph = m => (m === 'X' ? '✕' : '○');

    function render() {
      if (!state) { statusEl.textContent = 'Connecting…'; return; }
      const myTurn = room.connected && !state.winner && state.turn === me;
      // a player's oldest mark is "old" once they have MAX on the board; it's "next" if they move now
      const oldest = {};
      if (!state.winner) for (const m of ['X', 'O']) if (state.marks[m].length >= MAX) oldest[state.marks[m][0]] = m;
      cells.forEach((c, i) => {
        const v = state.board[i];
        const gone = animate && i === state.removed && !v;
        const mover = state.board[state.placed]; // the vanished mark belonged to whoever just moved
        const g = v ? glyph(v) : gone ? glyph(mover) : '';
        if (g) { const m = document.createElement('span'); m.className = 'm'; m.textContent = g; c.replaceChildren(m); }
        else c.replaceChildren();
        let cls = 'cell';
        if (v) cls += ' ' + v.toLowerCase();
        if (gone) cls += ' gone ' + mover.toLowerCase();
        if (oldest[i]) cls += ' old' + (state.turn === oldest[i] ? ' next' : '');
        if (state.line && state.line.includes(i)) cls += ' win';
        if (animate && i === state.placed) cls += ' pop';
        c.className = cls;
        c.disabled = !myTurn || !!v;
        c.setAttribute('aria-label', 'Square ' + (i + 1) + (v ? ': ' + v : '') + (oldest[i] ? ' (disappears next)' : ''));
      });
      animate = false;
      document.querySelector('#scoreX b').textContent = state.score.X;
      document.querySelector('#scoreO b').textContent = state.score.O;

      let text, cls = '';
      if (!room.connected) text = 'Waiting for your friend…';
      else if (state.winner) text = state.winner === me ? 'You win! 🎉' : 'Your friend wins.';
      else if (myTurn) { text = state.marks[me].length >= MAX ? 'Your turn: your dashed mark will vanish' : 'Your turn'; cls = 'turn-' + me.toLowerCase(); }
      else { text = "Friend's turn"; cls = 'turn-' + state.turn.toLowerCase(); }
      statusEl.textContent = text;
      statusEl.className = 'game-status ' + cls;
      againBtn.hidden = !state.winner || !room.connected;
    }
    render();
  })();
  </script>
</body>
</html>
